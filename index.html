// ── Intensity ──────────────────────────────────────────────────
function updateIntensity() {
  const tc = state.turnCount;
  const total = state.numPlayers * 10;
  const t18 = Math.round(total * 0.9);
  const t15 = Math.round(total * 0.75);
  const t10 = Math.round(total * 0.5);
  if (tc >= t18) { state.outlineBrighten=1; state.vignette=1; state.gframeGlow=1; }
  else if (tc >= t15) { state.outlineBrighten=1; state.vignette=1; state.gframeGlow=0; }
  else if (tc >= t10) { state.outlineBrighten=1; state.vignette=0; state.gframeGlow=0; }
}

// ── Float Labels ───────────────────────────────────────────────
function updateFloatLabels(dt) {
  for (let i = state.floatLabels.length - 1; i >= 0; i--) {
    const fl = state.floatLabels[i];
    fl.timer += dt * 1000;
    const p = Math.min(fl.timer / fl.dur, 1);
    fl.offsetY = -18 * p; fl.alpha = 1 - p;
    if (p >= 1) state.floatLabels.splice(i, 1);
  }
}

// ── Input Handling ─────────────────────────────────────────────
let hoveredSlot = -1;

function pointInRect(px, py, r) {
  return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
}

function startBoot() {
  ensureAudio();
  const bootAudio = new Audio("8bit startup.mp3");
  bootAudio.play().catch(() => {});
  state.phase = "boot";
  state.bootStart = performance.now();
}

function handleClick(canvasX, canvasY) {
  if (state.phase === "splash") { startBoot(); return; }
  if (state.phase === "boot") return;
  const btns = getButtons();

  // Confirmation dialog
  if (state.phase === "confirm") {
    const pw = Math.max(60, W * 0.33);
    const ph = Math.max(50, H * 0.33);
    const px = CX - pw/2, py = CY - ph/2;
    const btnW = Math.max(20, W * 0.06);
    const btnH = Math.max(12, H * 0.06);
    const btnY = py + ph * 0.56;
    const yesBtn = {x: CX - btnW - btnW * 0.15, y: btnY, w: btnW, h: btnH};
    const noBtn = {x: CX + btnW * 0.15, y: btnY, w: btnW, h: btnH};

    if (pointInRect(canvasX, canvasY, yesBtn)) {
      playSFX("keyclick", 0.125);
      returnToLobby();
      return;
    }

    if (pointInRect(canvasX, canvasY, noBtn)) {
      state.phase = "playing";
      state.confirmAction = null;
      return;
    }
    return;
  }

  // Lobby
  if (state.phase === "lobby") {
    // Close How to Play overlay if open
    if (state.howToExpanded) {
      state.howToExpanded = false;
      return;
    }
    if (pointInRect(canvasX, canvasY, btns.BTN_CREATE)) {
      if (!Net.connected) return;
      playSFX("keyclick", 0.125);
      state.phase = "playerCountSelect";
      return;
    }
    if (pointInRect(canvasX, canvasY, btns.BTN_JOIN)) {
      playSFX("keyclick", 0.125);
      state.phase = "joining";
      state.joinCode = "";
      state.lobbyError = "";
      return;
    }
    if (pointInRect(canvasX, canvasY, btns.BTN_HOTSEAT)) {
      playSFX("keyclick", 0.125);
      setTimeout(() => { sessionStorage.setItem("skipBoot", "1"); window.location.href = "golden-triangle.html"; }, 150);
      return;
    }
    if (pointInRect(canvasX, canvasY, btns.BTN_CPU)) {
      playSFX("keyclick", 0.125);
      setTimeout(() => { sessionStorage.setItem("skipBoot", "1"); window.location.href = "golden-triangle.html?cpu=1"; }, 150);
      return;
    }
    if (pointInRect(canvasX, canvasY, btns.BTN_HOWTO)) {
      state.howToExpanded = !state.howToExpanded;
      return;
    }
    return;
  }

  // Player Count Selection
  if (state.phase === "playerCountSelect") {
    if (pointInRect(canvasX, canvasY, btns.BTN_2P)) {
      playSFX("keyclick", 0.125);
      state.numPlayers = 2;
      state.phase = "modeSelection";
      return;
    }
    if (pointInRect(canvasX, canvasY, btns.BTN_3P)) {
      playSFX("keyclick", 0.125);
      state.numPlayers = 3;
      state.mapType = "random";
      state.scores = [0, 0, 0];
      state.roundScores = [0, 0, 0];
      state.phase = "modeSelection";
      return;
    }
    if (pointInRect(canvasX, canvasY, btns.BTN_BACK_COUNT)) {
      state.phase = "lobby";
      return;
    }
    return;
  }

  // Mode Selection
  if (state.phase === "modeSelection") {
    if (pointInRect(canvasX, canvasY, btns.BTN_REGULAR)) {
      playSFX("keyclick", 0.125);
      state.gameMode = "regular";
      if (state.numPlayers === 3) {
        // 3P always uses random map — skip map selection and create room
        state.mapType = "random";
        generateRandomMap(31);
        Net.createRoom(state.gameMode, "random", randomMapData);
      } else {
        state.phase = "mapSelection";
      }
      return;
    }
    if (pointInRect(canvasX, canvasY, btns.BTN_HIDDEN)) {
      playSFX("keyclick", 0.125);
      state.gameMode = "hidden";
      if (state.numPlayers === 3) {
        state.mapType = "random";
        generateRandomMap(31);
        Net.createRoom(state.gameMode, "random", randomMapData);
      } else {
        state.phase = "mapSelection";
      }
      return;
    }
    if (pointInRect(canvasX, canvasY, btns.BTN_BACK_MODE)) {
      state.phase = "playerCountSelect";
      return;
    }
    return;
  }

  // Map Selection
  if (state.phase === "mapSelection") {
    if (pointInRect(canvasX, canvasY, btns.BTN_STANDARD)) {
      playSFX("keyclick", 0.125);
      state.mapType = "standard";
      randomMapData = null;
      Net.createRoom(state.gameMode, "standard", null);
      return;
    }
    if (pointInRect(canvasX, canvasY, btns.BTN_RANDOM)) {
      playSFX("keyclick", 0.125);
      state.mapType = "random";
      generateRandomMap();
      Net.createRoom(state.gameMode, "random", randomMapData);
      return;
    }
    if (pointInRect(canvasX, canvasY, btns.BTN_BACK_MAP)) {
      state.phase = "modeSelection";
      return;
    }
    return;
  }

  // Waiting (cancel)
  if (state.phase === "waiting") {
    if (pointInRect(canvasX, canvasY, btns.BTN_BACK)) {
      returnToLobby();
    }
    return;
  }

  // Joining (start and back buttons)
  if (state.phase === "joining") {
    if (pointInRect(canvasX, canvasY, btns.BTN_START_JOIN)) {
      playSFX("keyclick", 0.125);
      if (state.joinCode.length === 4) {
        Net.joinRoom(state.joinCode);
      }
      return;
    }
    if (pointInRect(canvasX, canvasY, btns.BTN_BACK_JOIN)) {
      state.phase = "lobby";
      state.joinCode = "";
      state.lobbyError = "";
    }
    return;
  }

  // Round result - advance
  if (state.phase === "roundResult") {
    state.phase = "waitingAdvance";
    Net.advanceRound();
    return;
  }

  // Waiting for advance ack
  if (state.phase === "waitingAdvance") return;

  // Game over - return to lobby
  if (state.phase === "gameOver") {
    returnToLobby();
    return;
  }

  // Disconnected
  if (state.phase === "disconnected") return;

  // Playing - check for button clicks
  if (state.phase === "playing") {
    const margin = Math.max(8, W * 0.02);
    const bezelPad = Math.max(4, H * 0.015);
    const btnW = Math.max(20, W * 0.06);
    const btnH = Math.max(12, H * 0.045);
    const baseFontSize = Math.max(6, H * 0.03);
    const topY = margin + bezelPad;
    const btnY = topY + baseFontSize * 1.6;
    const restartBtn = {x: margin + bezelPad, y: btnY, w: btnW, h: btnH};
    const homeBtn = {x: margin + bezelPad + btnW + 4, y: btnY, w: btnW, h: btnH};

    if (pointInRect(canvasX, canvasY, restartBtn)) {
      playSFX("keyclick", 0.125);
      state.phase = "confirm";
      state.confirmAction = "restart";
      return;
    }

    if (pointInRect(canvasX, canvasY, homeBtn)) {
      playSFX("keyclick", 0.125);
      state.phase = "confirm";
      state.confirmAction = "home";
      return;
    }
  }

  // Playing - game actions
  if (state.phase !== "playing") return;

  const myIdx = Net.myIndex;
  const isMyTurn = state.currentPlayer === myIdx;

  const zoom = state.cameraZoom;
  const adjX = CX + (canvasX - CX) / zoom;
  const adjY = CY + (canvasY - CY) / zoom;

  // Check tray clicks - only own tray when it's your turn
  for (let owner = 0; owner < state.numPlayers; owner++) {
    const pieces = getPiecesForOwner(owner);
    const displayOrder = getTrayDisplayOrder(owner);

    for (let i = 0; i < 10; i++) {
      const pieceValue = displayOrder[i];
      const p = pieces[pieceValue - 1]; // pieces array is 0-indexed, values are 1-10
      if (p.used) continue;

      const pos = trayPiecePos(owner, i);
      const tpx = CX + (pos.x - CX), tpy = CY + (pos.y - CY);

      const hitPieceS = owner === 2 ? TRAY_GOLD_PIECE_S : TRAY_PIECE_S;
      if (pointInTriPadded(adjX, adjY, tpx, tpy, hitPieceS, "down", 8)) {
        if (owner !== myIdx) return; // Can't select opponent's pieces
        if (!isMyTurn) return; // Can't select when not your turn

        if (state.selectedPiece && state.selectedPiece.value === p.value && state.selectedPiece.owner === owner) {
          state.selectedPiece = null;
          Net.selectPiece(-1);
        } else {
          state.selectedPiece = { owner, value: p.value };
          Net.selectPiece(p.value);
        }
        return;
      }
    }
  }

  // Check board slot clicks
  if (!isMyTurn) return; // Can't place when not your turn

  for (let i = 0; i < SLOTS.length; i++) {
    const slot = SLOTS[i];
    const sx = CX + slot.x, sy = CY + slot.y;
    let hit = pointInTri(adjX, adjY, triVerts(sx, sy, S, slot.ori));
    if (!hit) hit = pointInTriPadded(adjX, adjY, sx, sy, S, slot.ori, 6);

    if (hit) {
      if (state.board[i] != null) { denySlot(i); return; }
      if (!state.selectedPiece) { denySlot(i); return; }

      // Place piece via Firebase
      Net.placePiece(i, state.selectedPiece.value);
      return;
    }
  }
}

function denySlot(slotId) {
  const sa = state.slotAnim[slotId];
  const shakeDur = 120;
  const startTime = performance.now();
  killTweens("shake" + slotId);
  const shakeT = {
    obj:null,prop:null,from:0,to:0,dur:shakeDur,elapsed:0,ease:linear,
    onDone:()=>{sa.shakeX=0;sa.outlineFlash=0;},
    tag:"shake"+slotId,done:false
  };
  shakeT._custom = true; shakeT._sa = sa; shakeT._startTime = startTime;
  tweens.push(shakeT);
  sa.outlineFlash = 0.7;
}

function updateShakeTweens(now) {
  for (const t of tweens) {
    if (!t._custom) continue;
    const elapsed = now - t._startTime;
    if (elapsed < t.dur) {
      const p = elapsed / t.dur;
      t._sa.shakeX = 6 * Math.sin(p * Math.PI * 4) * (1 - p);
      t._sa.outlineFlash = 0.7 * (1 - p);
    }
  }
}

function handleMouseMove(canvasX, canvasY) {
  const btns = getButtons();

  // Button hover for lobby
  if (state.phase === "lobby") {
    state.hoverCreate = pointInRect(canvasX, canvasY, btns.BTN_CREATE);
    state.hoverJoin = pointInRect(canvasX, canvasY, btns.BTN_JOIN);
    state.hoverHotSeat = pointInRect(canvasX, canvasY, btns.BTN_HOTSEAT);
    state.hoverCPU = pointInRect(canvasX, canvasY, btns.BTN_CPU);
    state.hoverHowTo = pointInRect(canvasX, canvasY, btns.BTN_HOWTO);
    return;
  }
  if (state.phase === "waiting") {
    state.hoverBack = pointInRect(canvasX, canvasY, btns.BTN_BACK);
    return;
  }
  if (state.phase === "joining") {
    state.hoverStartJoin = pointInRect(canvasX, canvasY, btns.BTN_START_JOIN);
    state.hoverBackJoin = pointInRect(canvasX, canvasY, btns.BTN_BACK_JOIN);
    return;
  }
  if (state.phase === "playerCountSelect") {
    state.hover2P = pointInRect(canvasX, canvasY, btns.BTN_2P);
    state.hover3P = pointInRect(canvasX, canvasY, btns.BTN_3P);
    state.hoverCountBack = pointInRect(canvasX, canvasY, btns.BTN_BACK_COUNT);
    return;
  }
  if (state.phase === "modeSelection") {
    state.hoverRegular = pointInRect(canvasX, canvasY, btns.BTN_REGULAR);
    state.hoverHidden = pointInRect(canvasX, canvasY, btns.BTN_HIDDEN);
    state.hoverBack = pointInRect(canvasX, canvasY, btns.BTN_BACK_MODE);
    return;
  }
  if (state.phase === "mapSelection") {
    state.hoverStandard = pointInRect(canvasX, canvasY, btns.BTN_STANDARD);
    state.hoverRandom = pointInRect(canvasX, canvasY, btns.BTN_RANDOM);
    state.hoverBackMap = pointInRect(canvasX, canvasY, btns.BTN_BACK_MAP);
    return;
  }

  // Confirmation dialog hovers
  if (state.phase === "confirm") {
    const pw = Math.max(60, W * 0.33);
    const ph = Math.max(50, H * 0.33);
    const px = CX - pw/2, py = CY - ph/2;
    const btnW = Math.max(20, W * 0.06);
    const btnH = Math.max(12, H * 0.06);
    const btnY = py + ph * 0.56;
    const yesBtn = {x: CX - btnW - btnW * 0.15, y: btnY, w: btnW, h: btnH};
    const noBtn = {x: CX + btnW * 0.15, y: btnY, w: btnW, h: btnH};

    state.hoverYes = pointInRect(canvasX, canvasY, yesBtn);
    state.hoverNo = pointInRect(canvasX, canvasY, noBtn);
    hoveredSlot = -1;
    return;
  }

  if (state.phase !== "playing") { hoveredSlot = -1; return; }

  // Playing - button hovers
  const margin = Math.max(8, W * 0.02);
  const bezelPad = Math.max(4, H * 0.015);
  const bw = Math.max(20, W * 0.06);
  const bh = Math.max(12, H * 0.045);
  const baseFontSize = Math.max(6, H * 0.03);
  const topY = margin + bezelPad;
  const by = topY + baseFontSize * 1.6;
  const restartBtn = {x: margin + bezelPad, y: by, w: bw, h: bh};
  const homeBtn = {x: margin + bezelPad + bw + 4, y: by, w: bw, h: bh};

  state.hoverRestart = pointInRect(canvasX, canvasY, restartBtn);
  state.hoverHome = pointInRect(canvasX, canvasY, homeBtn);

  const myIdx = Net.myIndex;
  const isMyTurn = state.currentPlayer === myIdx;
  if (!isMyTurn) { hoveredSlot = -1; return; }

  const zoom = state.cameraZoom;
  const adjX = CX + (canvasX - CX) / zoom;
  const adjY = CY + (canvasY - CY) / zoom;

  let newHover = -1;
  for (let i = 0; i < SLOTS.length; i++) {
    const slot = SLOTS[i];
    const sx = CX + slot.x, sy = CY + slot.y;
    if (pointInTriPadded(adjX, adjY, sx, sy, S, slot.ori, 6)) {
      if (state.board[i] == null) newHover = i;
      break;
    }
  }

  if (hoveredSlot >= 0 && hoveredSlot !== newHover) {
    const sa = state.slotAnim[hoveredSlot];
    addTween(sa, "hoverTint", sa.hoverTint, 0, 80, easeOut, null, "hover" + hoveredSlot);
  }
  if (newHover >= 0 && newHover !== hoveredSlot) {
    state.slotAnim[newHover].hoverTint = 1;
    killTweens("hover" + newHover);
  }
  hoveredSlot = newHover;
}

// Mouse/touch events
canvas.addEventListener("click", (e) => {
  const pos = screenToCanvas(e.clientX, e.clientY);
  handleClick(pos.x, pos.y);
});

canvas.addEventListener("mousemove", (e) => {
  const pos = screenToCanvas(e.clientX, e.clientY);
  handleMouseMove(pos.x, pos.y);
});

canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  if (e.touches.length > 0) {
    const pos = screenToCanvas(e.touches[0].clientX, e.touches[0].clientY);
    handleClick(pos.x, pos.y);
  }
}, {passive: false});

// Keyboard
document.addEventListener("keydown", (e) => {
  if (state.phase === "splash") { startBoot(); return; }
  if (state.phase === "boot") return;
  const key = e.key;

  // Lobby: joining phase - text input
  if (state.phase === "joining") {
    if (key === "Backspace") {
      state.joinCode = state.joinCode.slice(0, -1);
      state.lobbyError = "";
      return;
    }
    if (key === "Escape") {
      state.phase = "lobby";
      state.joinCode = "";
      state.lobbyError = "";
      return;
    }
    // Enter key removed - use Start button instead
    // Accept alphanumeric chars
    if (key.length === 1 && /[A-Za-z0-9]/.test(key) && state.joinCode.length < 4) {
      state.joinCode += key.toUpperCase();
      state.lobbyError = "";
      playSFX("keyclick", 0.125);
    }
    return;
  }

  if (key === " " || key === "Enter") {
    e.preventDefault();
    if (state.phase === "roundResult") {
      state.phase = "waitingAdvance";
      Net.send({ type: "advance_round" });
    } else if (state.phase === "gameOver") {
      returnToLobby();
    }
  }

  if (key === "r" || key === "R") {
    if (state.phase === "playing" || state.phase === "roundResult" || state.phase === "gameOver" || state.phase === "waitingAdvance") {
      returnToLobby();
    }
  }

  if (key === "Escape") {
    if (state.phase === "waiting") {
      returnToLobby();
    } else if (state.phase === "playerCountSelect") {
      state.phase = "lobby";
    } else if (state.phase === "modeSelection") {
      state.phase = "playerCountSelect";
    } else if (state.phase === "mapSelection") {
      state.phase = "modeSelection";
    }
  }
});

// ── Splash Screen Drawing ──────────────────────────────────────
function drawSplash(c, now) {
  if (state.phase !== "splash") return;
  // Black overlay covering everything below the title
  c.fillStyle = "#000";
  c.fillRect(0, 0, W, H);
  // Redraw lobby background elements (dim + specks + title) on top of black
  // (drawLobby already ran and drew them, but we covered with black — re-render title area)

  // Get title position
  const { titleY, titleSize } = getButtons();

  // Title — VCR font, all caps, scarlet
  c.save();
  const splashTitleSize = Math.max(10, titleSize * 0.55);
  c.font = `${splashTitleSize|0}px 'VCR OSD Mono', monospace`;
  c.textAlign = "center";
  c.textBaseline = "middle";
  c.fillStyle = COL.scarletBright;
  c.fillText("SCARLET TRIANGLE", CX, titleY);

  // "CLICK TO ENTER" raised up — 1/3 of the way down from title bottom to screen bottom
  const titleBottom = titleY + titleSize / 2;
  const textY = titleBottom + (H - titleBottom) * 0.33;
  const fontSize = Math.max(8, H * 0.065);
  c.font = `${fontSize|0}px 'VCR OSD Mono', monospace`;
  // Pulsing alpha
  const pulse = 0.5 + 0.5 * Math.sin(now / 400);
  c.fillStyle = `rgba(242, 242, 242, ${0.4 + pulse * 0.6})`;
  c.fillText("CLICK TO ENTER", CX, textY);
  c.restore();
}

// ── Boot Animation Drawing ─────────────────────────────────────
function drawBoot(c, now) {
  if (state.phase !== "boot") return;
  const t = (now - state.bootStart) / 1000; // seconds elapsed

  if (t >= 2.0) {
    state.phase = "lobby";
    return;
  }

  const { bootGrid, bootOrder, bootCols, bootRows, bootBlock } = state;
  const totalBlocks = bootOrder.length;

  if (t < 1.2) {
    // Phase 1: Progressive pixel fill (0 to 1.2s)
    c.fillStyle = "#000";
    c.fillRect(0, 0, W, H);
    const progress = t / 1.2;
    const blocksToShow = Math.floor(progress * totalBlocks);
    for (let i = 0; i < blocksToShow; i++) {
      const idx = bootOrder[i];
      const col = idx % bootCols;
      const row = Math.floor(idx / bootCols);
      c.fillStyle = bootGrid[idx];
      c.fillRect(col * bootBlock, row * bootBlock, bootBlock - 1, bootBlock - 1);
    }
  } else if (t < 1.6) {
    // Phase 2: Scanline wipe top-to-bottom (1.2s to 1.6s)
    // First draw full grid
    c.fillStyle = "#000";
    c.fillRect(0, 0, W, H);
    const wipeProgress = (t - 1.2) / 0.4;
    const wipeLine = wipeProgress * H;
    // Draw blocks only below wipe line
    for (let i = 0; i < totalBlocks; i++) {
      const idx = bootOrder[i];
      const col = idx % bootCols;
      const row = Math.floor(idx / bootCols);
      const blockY = row * bootBlock;
      if (blockY >= wipeLine) {
        c.fillStyle = bootGrid[idx];
        c.fillRect(col * bootBlock, blockY, bootBlock - 1, bootBlock - 1);
      }
    }
    // Draw bright scanline at wipe edge
    c.fillStyle = "rgba(0, 255, 65, 0.6)";
    c.fillRect(0, wipeLine - 2, W, 4);
  } else {
    // Phase 3: Fade out black overlay (1.6s to 2.0s)
    const fadeProgress = (t - 1.6) / 0.4;
    const alpha = 1.0 - fadeProgress;
    c.fillStyle = `rgba(0, 0, 0, ${alpha})`;
    c.fillRect(0, 0, W, H);
  }
}

// ── Main Loop ──────────────────────────────────────────────────
function frame(now) {
  const dt = Math.min((now - prevTime) / 1000, 0.05);
  prevTime = now;

  updateTweens(dt * 1000);
  updateShakeTweens(now);
  updateSpecks(dt);
  updateFloatLabels(dt);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(gDPR, 0, 0, gDPR, 0, 0);

  // Always draw background
  drawBackground(ctx);

  // Game layers (only when in a game)
  const inGame = ["playing", "roundResult", "waitingAdvance", "gameOver", "disconnected", "confirm"].includes(state.phase);
  if (inGame) {
    drawBoard(ctx, now);
    if (state.mapType !== "random") drawGFrame(ctx, now);
    drawTrays(ctx, now);
    drawHUD(ctx, now);
    drawRoundResult(ctx);
    drawGameOver(ctx);
    drawConfirmDialog(ctx);
    drawGoldFlash(ctx);
    drawToasts(ctx, dt * 1000);
    drawDisconnected(ctx, dt);
  }

  // Lobby layers
  drawLobby(ctx, now);
  drawModeSelection(ctx);
  drawMapSelection(ctx);
  drawPlayerCountSelect(ctx);

  // Splash & boot overlays (drawn on top of everything)
  drawSplash(ctx, now);
  drawBoot(ctx, now);

  requestAnimationFrame(frame);
}

// ── Init ───────────────────────────────────────────────────────
Net.connect();
requestAnimationFrame(frame);
</script>

<!-- CRT Television Overlay -->
<style>
.crt-overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
}

/* Scanlines */
.crt-overlay::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 2px,
    rgba(0, 0, 0, 0.06) 2px,
    rgba(0, 0, 0, 0.06) 4px
  );
  z-index: 1;
}

/* Vignette (screen curvature) */
.crt-overlay::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(
    ellipse at center,
    transparent 50%,
    rgba(0, 0, 0, 0.25) 75%,
    rgba(0, 0, 0, 0.6) 100%
  );
  z-index: 2;
}

/* Phosphor glow tint */
.crt-phosphor {
  position: absolute;
  inset: 0;
  background: rgba(40, 255, 60, 0.03);
  mix-blend-mode: screen;
  z-index: 3;
}

/* Chromatic aberration layer */
.crt-aberration {
  position: absolute;
  inset: 0;
  z-index: 0;
  backdrop-filter: none;
}
.crt-aberration::before,
.crt-aberration::after {
  content: '';
  position: absolute;
  inset: 0;
}
.crt-aberration::before {
  box-shadow: inset -1px 0 0 rgba(255, 0, 0, 0.06), inset 1px 0 0 rgba(0, 255, 255, 0.06);
}
.crt-aberration::after {
  box-shadow: inset 0 -1px 0 rgba(0, 0, 255, 0.05), inset 0 1px 0 rgba(255, 255, 0, 0.05);
}

/* CRT bezel frame */
.crt-frame {
  position: absolute;
  inset: 0;
  z-index: 6;
  border-radius: 12px;
  box-shadow:
    /* Outer plastic bezel - dark shell */
    inset 0 0 0 18px #1a1a1a,
    /* Inner bevel - slight highlight on top/left edge */
    inset 2px 2px 0 18px #2a2a2a,
    inset -2px -2px 0 18px #111,
    /* Screen recess groove */
    inset 0 0 0 22px #0a0a0a,
    /* Soft inner shadow from bezel onto screen */
    inset 0 0 30px 10px rgba(0, 0, 0, 0.5);
  /* Rounded screen opening */
  border: 4px solid #222;
}

/* Title-screen-only flicker */
.crt-flicker {
  position: absolute;
  inset: 0;
  z-index: 4;
  opacity: 0;
  animation: crtFlicker 4s infinite;
}
.crt-flicker.active { opacity: 1; }
.crt-flicker.submenu { opacity: 1; }
.crt-noise.flash-submenu { opacity: 0.03; }

@keyframes crtFlicker {
  0%, 96%, 100% { background: transparent; }
  97% { background: rgba(255, 255, 255, 0.015); }
  98% { background: rgba(0, 0, 0, 0.02); }
  99% { background: rgba(255, 255, 255, 0.01); }
}

/* Title-screen-only noise */
.crt-noise {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  z-index: 5;
  transition: opacity 0.05s;
}
.crt-noise.flash { opacity: 0.03; }
</style>

<div class="crt-overlay">
  <div class="crt-aberration"></div>
  <div class="crt-phosphor"></div>
  <div class="crt-flicker" id="crtFlicker"></div>
  <canvas class="crt-noise" id="crtNoiseCanvas"></canvas>
  <div class="crt-frame"></div>
</div>

<script>
(function() {
  const noiseCanvas = document.getElementById('crtNoiseCanvas');
  const noiseCtx = noiseCanvas.getContext('2d');
  const flickerEl = document.getElementById('crtFlicker');
  let noiseTimeout = null;

  function resizeNoise() {
    noiseCanvas.width = Math.ceil(window.innerWidth / 4);
    noiseCanvas.height = Math.ceil(window.innerHeight / 4);
  }
  resizeNoise();
  window.addEventListener('resize', resizeNoise);

  function drawNoise() {
    const w = noiseCanvas.width, h = noiseCanvas.height;
    const img = noiseCtx.createImageData(w, h);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = Math.random() * 255;
      d[i] = v; d[i+1] = v; d[i+2] = v; d[i+3] = 255;
    }
    noiseCtx.putImageData(img, 0, 0);
  }

  function flashNoise() {
    const isSubmenu = flickerEl.classList.contains('submenu');
    if (!flickerEl.classList.contains('active') && !isSubmenu) {
      noiseTimeout = setTimeout(flashNoise, 500);
      return;
    }
    drawNoise();
    const flashClass = isSubmenu ? 'flash-submenu' : 'flash';
    noiseCanvas.classList.add(flashClass);
    setTimeout(() => noiseCanvas.classList.remove(flashClass), 80 + Math.random() * 70);
    noiseTimeout = setTimeout(flashNoise, 2000 + Math.random() * 4000);
  }
  noiseTimeout = setTimeout(flashNoise, 1000 + Math.random() * 2000);

  const crtOverlay = document.querySelector('.crt-overlay');
  // Poll game phase to toggle CRT effects
  setInterval(() => {
    const phase = typeof state !== 'undefined' ? state.phase : '';
    const onTitle = phase === 'lobby';
    const onSubmenu = phase === 'playerCountSelect' || phase === 'modeSelection' || phase === 'mapSelection';
    flickerEl.classList.toggle('active', onTitle);
    flickerEl.classList.toggle('submenu', onSubmenu);
    crtOverlay.classList.toggle('submenu', onSubmenu);
  }, 200);
})();
</script>
</body>
</html>
